[package]
name = "mio-note"
version = "1.0.0"
edition = "2024"
description = "mio note (Mio): a lightweight handwriting notebook using native Windows Ink"
license = "MIT"
readme = "README.md"

[features]
# Store builds always use the package's private LocalState directory.
store = ["windows/Storage", "windows/Storage_Search"]

[dependencies]
windows-core = "0.62.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
zip = { version = "=9.1.2", default-features = false }
windows = { version = "0.62.2", features = [
    "Foundation",
    "Storage_Streams",
    "UI_Core",
    "UI_Input_Inking",
    "Win32_Foundation",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ink",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Most work is in Windows Ink; keep the native wrapper small for fast loading.
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[dev-dependencies]
windows-collections = "0.3.2"
windows-numerics = "0.3.1"
